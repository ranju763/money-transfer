spring:
  application:
    name: money-transfer-system

  # Loads application-local.yml (git-ignored) by default for local development.
  # Override with SPRING_PROFILES_ACTIVE or supply the env vars below directly.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    # MySQL connection. Credentials come from environment variables (see .env.example)
    # or application-local.yml. No secrets are committed to source control.
    url: jdbc:mysql://localhost:3306/money_transfer_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always # This forces data.sql to run on startup

  jpa:
    defer-datasource-initialization: true # Ensures Hibernate creates tables BEFORE data.sql runs
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    user:
      name: user
      password: password

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    com.banking.moneytransfer: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

cors:
  allow-origin: "http://localhost:4200"

dummy:
  enable: true

