<header class="app-header bg-white border-bottom sticky-top animate-down">
  <div class="container-fluid px-4 h-100">
    <div class="d-flex justify-content-between align-items-center h-100">

      <!-- Brand + nav -->
      <div class="d-flex align-items-center gap-5 h-100">
        <a routerLink="/dashboard" class="brand d-flex align-items-center gap-2 text-decoration-none">
          <i class="bi bi-bank2 brand-icon"></i>
          <span class="brand-name">SwiftPay</span>
        </a>

        <nav class="main-nav d-flex align-items-center gap-4 h-100">
          <a routerLink="/dashboard" routerLinkActive="active" class="topnav-link">Dashboard</a>
          <a routerLink="/transactions" routerLinkActive="active" class="topnav-link">Transactions</a>
          <a routerLink="/transfer" routerLinkActive="active" class="topnav-link">Transfer</a>
          <a routerLink="/rewards" routerLinkActive="active" class="topnav-link">Rewards</a>
        </nav>
      </div>

      <!-- Points + user + exit -->
      <div class="d-flex align-items-center gap-3">
        <a routerLink="/rewards" class="points text-decoration-none" title="Your reward points">
          <i class="bi bi-coin"></i>
          <span class="points-val">{{ points() }}</span>
          <span class="points-label">SwiftCoins</span>
        </a>
        <button (click)="logout()" class="exit-btn" title="Logout" aria-label="Logout">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>
  </div>
</header>
